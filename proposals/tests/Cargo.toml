[package]
name = "cold-snapshot-tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate_rust_snapshot"
path = "src/generate_rust_snapshot.rs"

[[bin]]
name = "generate_rust_snapshot_streaming"
path = "src/generate_rust_snapshot_streaming.rs"

[[bin]]
name = "verify_rust_snapshot"
path = "src/verify_rust_snapshot.rs"

[dependencies]
rand = "0.8"
sha2 = "0.10"
blake3 = "1.5"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
memmap2 = "0.9"
bincode = "1.3"
rayon = "1.8"
hex = "0.4"
lz4_flex = "0.11"

[dev-dependencies]
tempfile = "3.8"